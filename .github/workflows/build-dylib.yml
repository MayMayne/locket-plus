name: Build LocketPlus.dylib

on:
  push:
    branches: [main]
    paths: ['Tweak/**', 'build.sh', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylib (arm64)
        id: build
        run: |
          set +e
          chmod +x build.sh
          ./build.sh build > /tmp/lp_build.log 2>&1
          echo "exit=$?" >> /tmp/lp_build.log
          cat /tmp/lp_build.log

      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request, datetime
          log = open("/tmp/lp_build.log", errors="replace").read()[-60000:]
          ok = "exit=0" in log and "error:" not in log.lower().split("exit=")[0]
          body = json.dumps({
            "message": "build log " + datetime.datetime.utcnow().isoformat(),
            "content": __import__("base64").b64encode(("# build\n\n```\n" + log + "\n```\n").encode()).decode(),
            "branch": "main",
          })
          # lấy sha hiện tại để ghi đè
          import urllib.error
          get = urllib.request.Request(
            "https://api.github.com/repos/MayMayne/locket-plus/contents/BUILD_LOG.md?ref=main",
            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json", "User-Agent": "gha"})
          try:
            cur = json.loads(urllib.request.urlopen(get, timeout=60).read())
            body = json.loads(body)
            body["sha"] = cur["sha"]
            body = json.dumps(body)
          except urllib.error.HTTPError:
            pass
          body = body.encode()
          req = urllib.request.Request(
            "https://api.github.com/repos/MayMayne/locket-plus/contents/BUILD_LOG.md",
            data=body, method="PUT",
            headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json", "User-Agent": "gha"})
          print(urllib.request.urlopen(req, timeout=60).status)
          PY

      - name: Verify and sign
        run: |
          file build/LocketPlus.dylib && ls -l build/LocketPlus.dylib
          codesign -s - -f build/LocketPlus.dylib
          codesign -dv build/LocketPlus.dylib 2>&1 | head -5

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dylib-${{ github.run_id }}"
          gh release create "$TAG" build/LocketPlus.dylib \
            --repo MayMayne/locket-plus \
            --title "LocketPlus.dylib" \
            --notes "arm64, build ${{ github.run_id }}"
          echo "RELEASE_OK"

      - uses: actions/upload-artifact@v4
        with:
          name: LocketPlus.dylib
          path: build/LocketPlus.dylib
          if-no-files-found: error
